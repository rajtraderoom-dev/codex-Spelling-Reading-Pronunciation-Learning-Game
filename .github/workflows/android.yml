name: Android APK
on:
  push:
    paths: ['android/**', 'tools/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.2' 'build-tools;37.0.0'
      - run: python3 tools/check_android_content.py
      - working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WordGarden-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
